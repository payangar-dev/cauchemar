name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.6-stable

jobs:
  validate:
    name: Validate Godot project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-headless

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Print Godot version
        run: godot --headless --version

      - name: Import project resources
        working-directory: game
        run: godot --headless --import || true

      - name: Smoke test (parse autoloads + run 1 frame)
        working-directory: game
        run: godot --headless --quit-after 1
